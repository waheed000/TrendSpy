name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Install backend dependencies
        run: cd trendspy-backend && npm install

      - name: Build frontend
        run: npm run build

      - name: Build backend (Next.js)
        run: cd trendspy-backend && npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || '' }}
          JWT_SECRET: ci-test-secret-not-for-production
